name: Refresh artist data

# Real-internet jobs — image scraping, candidate discovery, event scraping —
# need a runner that artist sites don't 403. Vercel/Pages serve the static
# output; this workflow regenerates that output once a day (or on demand).
#
# What this DOES run:
#   - refresh_images.py     (scrape each artist site for photos)
#   - discover_artists.py   (scan rosters for new candidates)
#   - scrape_events.py      (scrape art-event calendars)
#   - build_dashboard.py    (regenerate index.html)
#
# What this does NOT run:
#   - score_with_claude.py  (needs your Claude subscription via the CLI; do it
#                            from Claude Code with /refresh after this finishes)

on:
  schedule:
    - cron: "0 8 * * *"    # 08:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh artist images
        run: python -m scripts.refresh_images --force --log INFO
        continue-on-error: true

      - name: Discover new candidates
        run: python -m scripts.discover_artists
        continue-on-error: true

      - name: Scrape events
        run: python -m scripts.scrape_events
        continue-on-error: true

      - name: Rebuild dashboard
        run: python -m scripts.build_dashboard

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily data refresh · $(date -u +%Y-%m-%d)

            Runner: ${{ github.run_id }}
            "
            git push
          fi
