name: Daily artist digest

on:
  schedule:
    # 08:00 UTC = midnight Pacific (PDT) / 1am PST. Runs every day.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      skip_discover:
        description: "Skip discovery step"
        required: false
        default: "false"
      skip_scoring:
        description: "Skip Claude scoring"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-4-7' }}
        run: |
          ARGS=""
          if [ "${{ inputs.skip_discover }}" = "true" ]; then ARGS="$ARGS --skip-discover"; fi
          if [ "${{ inputs.skip_scoring }}" = "true" ]; then ARGS="$ARGS --skip-scoring"; fi
          python -m scripts.run_daily $ARGS

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily digest · $(date -u +%Y-%m-%d)

            Run: ${{ github.run_id }}
            "
            git push
          fi

  deploy-pages:
    needs: digest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
